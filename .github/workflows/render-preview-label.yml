name: Render preview label

# Render only creates a preview for a PR whose title contains "[render preview]"
# (render.yaml sets previews.generation: manual). This keeps that title tag in
# step with a "preview" label, so adding or removing the label opts the PR in or out.
on:
  pull_request:
    types: [labeled, unlabeled]

permissions:
  pull-requests: write

jobs:
  sync-title:
    if: github.event.label.name == 'preview'
    runs-on: ubuntu-latest
    steps:
      - name: Sync "[render preview]" in the PR title
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          tag="[render preview]"
          title="$PR_TITLE"
          if [ "$ACTION" = "labeled" ]; then
            case "$title" in
              *"$tag"*) exit 0 ;;
            esac
            new_title="$title $tag"
          else
            new_title="$(printf '%s' "$title" | sed 's/ *\[render preview\]//g')"
          fi
          if [ "$new_title" != "$title" ]; then
            gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --title "$new_title"
          fi
